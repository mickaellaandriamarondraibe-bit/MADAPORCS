<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Gestion des Ingrédients - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Ressources</div>
                <h1>Formulaire Gestion des Ingrédients - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/ingredients}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/ingredients/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Nom</label><input type="text" name="libelle" placeholder="Nom"></div><div class="form-group"><label>Prix/kg</label><input type="number" name="prixKg" placeholder="Prix/kg"></div><div class="form-group"><label>Stock actuel kg</label><input type="number" name="stockActuelKg" placeholder="Stock actuel kg"></div><div class="form-group"><label>Seuil minimum kg</label><input type="number" name="seuilMinKg" placeholder="Seuil minimum kg"></div><div class="form-group"><label>Unité</label><input type="text" name="unite" placeholder="Unité"></div><div class="form-group"><label>Actif</label><select name="actif"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/ingredients}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
