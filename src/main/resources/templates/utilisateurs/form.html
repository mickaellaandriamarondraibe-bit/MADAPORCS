<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Gestion des Utilisateurs - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Administration</div>
                <h1>Formulaire Gestion des Utilisateurs - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/utilisateurs}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/utilisateurs/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Nom</label><input type="text" name="nom" placeholder="Nom"></div><div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Email"></div><div class="form-group"><label>Mot de passe</label><input type="password" name="motDePasse" placeholder="Mot de passe"></div><div class="form-group"><label>Rôle</label><select name="roleId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Statut</label><select name="statutUtilisateurId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/utilisateurs}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
