<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Mouvements des Lots - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Production</div>
                <h1>Formulaire Mouvements des Lots - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/lots/mouvements}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <div class="alert alert-error" th:if="${erreur}" th:text="${erreur}"></div>

            <form method="post" th:action="@{/lots/mouvements/save}" th:object="${mouvement}">
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Lot</label>
                        <select th:field="*{lotPorcId}">
                            <option value="">Sélectionner</option>
                            <option th:each="lot : ${lots}" th:value="${lot.id}" th:text="${lot.codeLot}">LOT-001</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Type mouvement</label>
                        <select th:field="*{typeMouvementLotId}">
                            <option value="">Sélectionner</option>
                            <option th:each="type : ${typesMouvement}" th:value="${type.id}" th:text="${type.libelle}">Entrée</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Quantité</label><input type="number" th:field="*{quantite}" placeholder="Quantité"></div>
                    <div class="form-group"><label>Date mouvement</label><input type="datetime-local" th:field="*{dateMouvement}" placeholder="Date mouvement"></div>
                    <div class="form-group"><label>Motif</label><textarea th:field="*{motif}" placeholder="Motif"></textarea></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/lots/mouvements}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
