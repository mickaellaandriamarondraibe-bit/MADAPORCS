<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Gestion des Employés - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Personnel</div>
                <h1>Formulaire Gestion des Employés - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/employes}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/employes/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Nom</label><input type="text" name="nom" placeholder="Nom"></div><div class="form-group"><label>Prénom</label><input type="text" name="prenom" placeholder="Prénom"></div><div class="form-group"><label>Contact</label><input type="text" name="contact" placeholder="Contact"></div><div class="form-group"><label>Adresse</label><textarea name="adresse" placeholder="Adresse"></textarea></div><div class="form-group"><label>Poste</label><select name="posteEmployeId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Statut</label><select name="statutEmployeId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Date embauche</label><input type="date" name="dateEmbauche" placeholder="Date embauche"></div><div class="form-group"><label>Salaire base</label><input type="number" name="salaireBase" placeholder="Salaire base"></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/employes}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
