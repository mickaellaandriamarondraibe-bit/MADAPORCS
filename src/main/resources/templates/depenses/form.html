<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Dépenses - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Finance</div>
                <h1>Formulaire Dépenses - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/depenses}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/depenses/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Catégorie</label><select name="categorieDepenseId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Libellé</label><input type="text" name="libelle" placeholder="Libellé"></div><div class="form-group"><label>Montant</label><input type="number" name="montant" placeholder="Montant"></div><div class="form-group"><label>Date dépense</label><input type="date" name="dateDepense" placeholder="Date dépense"></div><div class="form-group"><label>Description</label><textarea name="description" placeholder="Description"></textarea></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/depenses}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
