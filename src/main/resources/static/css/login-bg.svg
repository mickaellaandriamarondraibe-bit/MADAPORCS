<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9c8"/>
      <stop offset="0.45" stop-color="#f6cfa0"/>
      <stop offset="1" stop-color="#e9b98a"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bbf6a"/><stop offset="1" stop-color="#6fa851"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9d47"/><stop offset="1" stop-color="#4a8637"/>
    </linearGradient>
  </defs>

  <!-- ciel -->
  <rect width="1000" height="1500" fill="url(#sky)"/>
  <!-- soleil -->
  <circle cx="740" cy="360" r="130" fill="#fff3dd" opacity="0.9"/>
  <circle cx="740" cy="360" r="90" fill="#ffe9bf"/>
  <!-- nuages -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="250" cy="300" rx="120" ry="38"/>
    <ellipse cx="330" cy="285" rx="90" ry="34"/>
    <ellipse cx="560" cy="220" rx="100" ry="30"/>
  </g>

  <!-- collines -->
  <path d="M0 760 Q250 660 520 740 T1000 720 V1500 H0 Z" fill="url(#hillFar)"/>
  <path d="M0 900 Q300 800 620 900 T1000 870 V1500 H0 Z" fill="url(#hillNear)"/>

  <!-- champ / clôture -->
  <g stroke="#e9d9b8" stroke-width="10" opacity="0.75" stroke-linecap="round">
    <line x1="60" y1="1120" x2="60" y2="1030"/>
    <line x1="200" y1="1130" x2="200" y2="1040"/>
    <line x1="340" y1="1140" x2="340" y2="1050"/>
    <line x1="20" y1="1070" x2="380" y2="1085"/>
    <line x1="20" y1="1110" x2="380" y2="1125"/>
  </g>

  <!-- grange -->
  <g>
    <rect x="600" y="820" width="300" height="230" fill="#b5462f"/>
    <polygon points="580,825 750,720 920,825" fill="#8f3524"/>
    <rect x="700" y="905" width="100" height="145" fill="#e9d9b8"/>
    <line x1="750" y1="905" x2="750" y2="1050" stroke="#b5462f" stroke-width="8"/>
    <rect x="640" y="855" width="55" height="55" fill="#f2e6cc"/>
    <rect x="805" y="855" width="55" height="55" fill="#f2e6cc"/>
  </g>

  <!-- porcs (silhouettes stylisees) -->
  <g fill="#f4b6b0">
    <!-- porc 1 -->
    <g transform="translate(250,1180)">
      <ellipse cx="0" cy="0" rx="120" ry="72" fill="#f4b6b0"/>
      <circle cx="118" cy="-18" r="52" fill="#f4b6b0"/>
      <ellipse cx="150" cy="-8" rx="20" ry="16" fill="#eaa39c"/>
      <circle cx="156" cy="-14" r="4" fill="#7a4b47"/><circle cx="156" cy="-2" r="4" fill="#7a4b47"/>
      <circle cx="104" cy="-42" r="4" fill="#5c3a37"/>
      <polygon points="96,-56 82,-86 116,-70" fill="#eaa39c"/>
      <rect x="-70" y="58" width="18" height="40" rx="8" fill="#eaa39c"/>
      <rect x="-10" y="58" width="18" height="40" rx="8" fill="#eaa39c"/>
      <rect x="50" y="58" width="18" height="40" rx="8" fill="#eaa39c"/>
      <path d="M-118 -6 q-34 6 -30 40" fill="none" stroke="#eaa39c" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- porc 2 (plus petit) -->
    <g transform="translate(520,1250) scale(0.72)">
      <ellipse cx="0" cy="0" rx="120" ry="72" fill="#f7c4bf"/>
      <circle cx="118" cy="-18" r="52" fill="#f7c4bf"/>
      <ellipse cx="150" cy="-8" rx="20" ry="16" fill="#eaa39c"/>
      <circle cx="156" cy="-14" r="4" fill="#7a4b47"/><circle cx="156" cy="-2" r="4" fill="#7a4b47"/>
      <polygon points="96,-56 82,-86 116,-70" fill="#eaa39c"/>
      <rect x="-70" y="58" width="18" height="40" rx="8" fill="#eaa39c"/>
      <rect x="10" y="58" width="18" height="40" rx="8" fill="#eaa39c"/>
    </g>
  </g>

  <!-- herbe premier plan -->
  <path d="M0 1300 Q250 1250 500 1300 T1000 1290 V1500 H0 Z" fill="#3f7530"/>
</svg>
