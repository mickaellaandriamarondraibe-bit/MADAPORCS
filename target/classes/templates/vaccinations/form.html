<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Journal des Vaccinations - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Santé</div>
                <h1>Formulaire Journal des Vaccinations - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/vaccinations}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/vaccinations/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Lot</label><select name="lotPorcId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Reproducteur</label><select name="reproducteurId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Vaccin</label><select name="vaccinId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Date vaccination</label><input type="date" name="dateVaccination" placeholder="Date vaccination"></div><div class="form-group"><label>Date rappel</label><input type="date" name="dateRappel" placeholder="Date rappel"></div><div class="form-group"><label>Dose</label><input type="text" name="dose" placeholder="Dose"></div><div class="form-group"><label>Observation</label><textarea name="observation" placeholder="Observation"></textarea></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/vaccinations}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
