<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Client - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

        <header class="topbar">
            <div>
                <span class="breadcrumb">MADAPORC / Commerce / Clients</span>
                <h1 th:text="${client.id == null ? 'Ajouter un client' : 'Modifier un client'}">
                    Ajouter un client
                </h1>
            </div>

            <div class="topbar-actions">
                <a href="/profil" class="profile">Gestionnaire</a>
                <a href="/logout" class="logout">Déconnexion</a>
            </div>
        </header>

        <section class="card">

            <div th:if="${erreur}" class="alert-error" th:text="${erreur}"></div>

            <form th:action="@{/clients/save}" th:object="${client}" method="post" class="form-grid">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" th:field="*{nom}" placeholder="Nom du client">
                </div>

                <div class="form-group">
                    <label>Type client</label>
                    <select th:field="*{typeClient}">
                        <option value="">Choisir</option>
                        <option value="Particulier">Particulier</option>
                        <option value="Entreprise">Entreprise</option>
                        <option value="Revendeur">Revendeur</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" th:field="*{contact}" placeholder="Téléphone">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="client@email.com">
                </div>

                <div class="form-group full">
                    <label>Adresse</label>
                    <textarea th:field="*{adresse}" rows="4" placeholder="Adresse du client"></textarea>
                </div>

                <div class="actions" style="grid-column: 1 / -1; justify-content: flex-end; gap: 12px;">
                    <a th:href="@{/clients}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-blue">Enregistrer</button>
                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
