<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titre} + ' - MADAPORC'">MADAPORC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/material-symbols.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="content">
    <div class="placeholder-card">
        <p class="tag">PLACEHOLDER STRICT PDF</p>
        <h1 th:text="${titre}">Titre</h1>
        <p><strong>Controller :</strong> <span th:text="${controllerName}">Controller</span></p>
        <p><strong>Méthode :</strong> <span th:text="${methodName}">method</span></p>
        <p><strong>Route :</strong> <span th:text="${route}">route</span></p>
        <div class="figma">
            <strong>Référence Figma :</strong>
            <span th:text="${referenceFigma}">Référence Figma</span>
        </div>
        <p>Cette page est volontairement vide. Elle sera remplacée par la vraie vue du module.</p>
    </div>
</main>
</body>
</html>
