<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Liste des Reproducteurs - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Reproduction</div>
                <h1>Formulaire Liste des Reproducteurs - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/reproducteurs}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/reproducteurs/save}" th:object="${reproducteur}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Code reproducteur</label>
                        <input type="text" th:field="*{codeReproducteur}" placeholder="Code reproducteur">
                    </div>
                    
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" th:field="*{nom}" placeholder="Nom">
                    </div>
                    <div class="form-group">
                        <label>Race</label>
                        <select name="raceId" th:field="*{raceId}">
                            <option value="">Sélectionner</option>
                            <option th:each="race : ${races}" th:value="${race.id}" th:text="${race.libelle}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sexe</label>
                        <select th:field="*{sexeId}">
                            <option value="">Sélectionner</option>
                            <option th:each="sexe : ${sexes}" th:value="${sexe.id}" th:text="${sexe.libelle}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select th:field="*{statutReproducteurId}">
                            <option value="">Sélectionner</option>
                            <option th:each="statut : ${statuts}" th:value="${statut.id}" th:text="${statut.libelle}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date naissance</label>
                        <input type="date" th:field="*{dateNaissance}" placeholder="Date naissance">
                    </div>
                    <div class="form-group">
                        <label>Poids kg</label>
                        <input type="number" th:field="*{poidsKg}" placeholder="Poids kg">
                    </div>
                    <div class="form-group">
                        <label>Observation</label>
                        <textarea th:field="*{observation}" placeholder="Observation"></textarea>
                    </div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/reproducteurs}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
