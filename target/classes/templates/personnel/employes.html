<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Liste des employés</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR (si tu as fragment) -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

        <!-- HEADER -->
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Personnel</div>
                <h1>Liste des employés</h1>
                <p class="page-subtitle">Gestion des employés, postes et statuts</p>
            </div>

            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/employes/form}">+ Ajouter</a>
            </div>
        </header>

        <!-- FILTRES -->
        <section class="card">

            <form class="filters" th:action="@{/employes}" method="get">

                <div class="form-group">
                    <label>Recherche</label>
                    <input type="text" name="motCle" th:value="${motCle}" placeholder="Nom ou prénom">
                </div>

                <div class="form-group">
                    <label>Poste</label>
                    <select name="posteId">
                        <option value="">Tous</option>
                        <option th:each="p : ${postes}"
                                th:value="${p.id}"
                                th:text="${p.libelle}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Statut</label>
                    <select name="statutId">
                        <option value="">Tous</option>
                        <option th:each="s : ${statuts}"
                                th:value="${s.id}"
                                th:text="${s.libelle}">
                        </option>
                    </select>
                </div>

                <div>
                    <button type="submit" class="btn btn-dark">Rechercher</button>
                </div>

            </form>

        </section>

        <!-- TABLE -->
        <section class="card">

            <div class="card-header">
                <div>
                    <h2>Employés</h2>
                    <p>Liste complète des employés enregistrés</p>
                </div>
            </div>

            <div class="table-wrap">

                <table class="data-table">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Contact</th>
                        <th>Adresse</th>
                        <th>Date embauche</th>
                        <th>Salaire</th>
                        <th>Poste</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="employe : ${employes}">

                        <td th:text="${employe.id}"></td>
                        <td th:text="${employe.nom}"></td>
                        <td th:text="${employe.prenom}"></td>
                        <td th:text="${employe.contact}"></td>
                        <td th:text="${employe.adresse}"></td>
                        <td th:text="${employe.dateEmbauche}"></td>
                        <td th:text="${employe.salaireBase}"></td>

                        <td th:text="${employe.posteEmploye != null ? employe.posteEmploye.libelle : ''}"></td>

                        <td>
                            <span class="badge"
                                  th:text="${employe.statutEmploye != null ? employe.statutEmploye.libelle : ''}">
                            </span>
                        </td>

                        <td>

                            <a class="link-action"
                               th:href="@{/employes/form(id=${employe.id})}">
                                Modifier
                            </a>

                            <form th:action="@{/employes/archiver(id=${employe.id})}"
                                  method="post"
                                  style="display:inline">

                                <button type="submit" class="btn btn-warning">
                                    Archiver
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(employes)}">
                        <td colspan="10" class="empty">
                            Aucun employé trouvé
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>
</html>
