<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des employés</title>
</head>
<body>

    <h1>Liste des employés</h1>

    <p>
        <a th:href="@{/employes/new}">Ajouter employé</a>
    </p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Contact</th>
                <th>Adresse</th>
                <th>Date embauche</th>
                <th>Salaire</th>
                <th>Poste</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="employe : ${employes}">
                <td th:text="${employe.id}"></td>
                <td th:text="${employe.nom}"></td>
                <td th:text="${employe.prenom}"></td>
                <td th:text="${employe.contact}"></td>
                <td th:text="${employe.adresse}"></td>
                <td th:text="${employe.dateEmbauche}"></td>
                <td th:text="${employe.salaireBase}"></td>

                <td th:text="${employe.posteEmploye != null ? employe.posteEmploye.libelle : ''}"></td>

                <td th:text="${employe.statutEmploye != null ? employe.statutEmploye.libelle : ''}"></td>
                <td>
                    <a th:href="@{/employes/edit/{id}(id=${employe.id})}">Modifier</a>

                    <form th:action="@{/employes/desactiver/{id}(id=${employe.id})}" method="post" style="display:inline">
                        <button type="submit">Désactiver</button>
                    </form>

                    <form th:action="@{/employes/delete/{id}(id=${employe.id})}" method="post" style="display:inline">
                        <button type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
