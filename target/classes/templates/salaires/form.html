<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Gestion des Salaires - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Personnel</div>
                <h1>Formulaire Gestion des Salaires - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/salaires}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/salaires/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Employé</label><select name="employeId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Mois</label><input type="number" name="mois" placeholder="Mois"></div><div class="form-group"><label>Année</label><input type="number" name="annee" placeholder="Année"></div><div class="form-group"><label>Salaire base</label><input type="number" name="montantBase" placeholder="Salaire base"></div><div class="form-group"><label>Prime</label><input type="number" name="prime" placeholder="Prime"></div><div class="form-group"><label>Retenue</label><input type="number" name="retenue" placeholder="Retenue"></div><div class="form-group"><label>Statut paiement</label><select name="statutPaiement"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/salaires}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
