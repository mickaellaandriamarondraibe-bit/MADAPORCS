<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Mouvements de Stock - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Ressources</div>
                <h1>Formulaire Mouvements de Stock - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/stocks/mouvements}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/stocks/mouvements/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Ingrédient</label><select name="ingredientId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Type mouvement</label><select name="typeMouvementStockId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Quantité kg</label><input type="number" name="quantiteKg" placeholder="Quantité kg"></div><div class="form-group"><label>Prix total</label><input type="number" name="prixTotal" placeholder="Prix total"></div><div class="form-group"><label>Date mouvement</label><input type="datetime-local" name="dateMouvement" placeholder="Date mouvement"></div><div class="form-group"><label>Motif</label><textarea name="motif" placeholder="Motif"></textarea></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/stocks/mouvements}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
