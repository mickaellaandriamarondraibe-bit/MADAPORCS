<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Cycles de Production - GestPorc</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <header class="app-header">
            <div>
                <div class="eyebrow">MADAPORC / Production</div>
                <h1>Formulaire Cycles de Production - GestPorc</h1>
                <p class="page-subtitle">Formulaire conforme au style Figma : simple, lisible et professionnel.</p>
            </div>
            <div class="header-actions">
                <a class="btn btn-secondary" th:href="@{/cycles}">Retour</a>
            </div>
        </header>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2>Informations</h2>
                    <p>Complétez les champs nécessaires puis enregistrez.</p>
                </div>
            </div>

            <form method="post" th:action="@{/cycles/save}">
                <div class="form-grid">
                    <div class="form-group"><label>Code cycle</label><input type="text" name="codeCycle" placeholder="Code cycle"></div><div class="form-group"><label>Lot</label><select name="lotPorcId"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div><div class="form-group"><label>Date début</label><input type="date" name="dateDebut" placeholder="Date début"></div><div class="form-group"><label>Date fin prévue</label><input type="date" name="dateFinPrevue" placeholder="Date fin prévue"></div><div class="form-group"><label>Naissances</label><input type="number" name="nombreNaissances" placeholder="Naissances"></div><div class="form-group"><label>Pertes</label><input type="number" name="nombrePertes" placeholder="Pertes"></div><div class="form-group"><label>Vendables</label><input type="number" name="nombreVendables" placeholder="Vendables"></div><div class="form-group"><label>Statut</label><select name="statutCycle"><option value="">Sélectionner</option><option>Actif</option><option>En cours</option><option>Archivé</option></select></div>
                </div>
                <div class="actions" style="margin-top:22px">
                    <button type="submit" class="btn">Enregistrer</button>
                    <a class="btn btn-secondary" th:href="@{/cycles}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
